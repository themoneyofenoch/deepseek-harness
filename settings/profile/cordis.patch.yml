# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: compact
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
    fontSize: 20
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: false
    tabsEnabled:
      sidechat: true
      editor: true
      diff: true
- id: dream-skin
  disabled: false
- id: dsh-context
  disabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: deepseek-account
        model: deepseek-flash
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
# 2026-10-14 (Harness guy, approved by Ammaniel "yes"): a Bot conversation is condensed by
# ds-bot itself, never by dsh's compaction (ds-bot src/host/parts.js wraps the engine and
# returns null for Bot sessions). ds-bot's own check line is checkRatio of the usable window:
# (1,000,000 window - 256,000 reply reserve) * 0.8 = ~595,200 tokens, which is why a Bot part
# grew to ~576K. 0.08 puts the check line at ~59,520 tokens, so a Bot chat condenses in place
# or moves to a new part around 60K. 2026-10-16 (Ammaniel picked b): back to 0.8 stock.
- id: bot
  config:
    checkRatio: 0.8
# 2026-10-17 (Harness guy; Ammaniel picked "use the built-in toggle"). 0.2.1-rc.2 ships the
# DeepSeek Search and Fetch API providers, the same selection the "Use the new Web Search API"
# switch writes in Plugins > Built-in plugin settings > Web search. Replaces the temporary
# ds-bot/web-search searchApis entry: one direct API call per search (~0.7 s), no model round-trip.
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api
- id: web-deepseek-api
  name: "@deepseek-ai/dsh-web-deepseek-api"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
